name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Lint & Tests (Node ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Neueste 24er laut .nvmrc und die kleinste erlaubte 22er (Brotli-Fix, CVE-2026-111497).
          # Exakte Versionen: mit nur „22“ nimmt setup-node evtl. eine ältere, vorinstallierte Version.
          - label: 24 (.nvmrc)
            node-version-file: .nvmrc
          - label: 22.23.4
            node-version: 22.23.4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Unit-Tests (Vitest)
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Ohne Stockfoto-/Instagram-Download: prüft, dass alle Seiten fehlerfrei bauen
      - run: npm run build:local
      - name: Anzahl erzeugter Seiten
        run: echo "$(find .vercel/output/static -name '*.html' | wc -l) HTML-Seiten gebaut" >> "$GITHUB_STEP_SUMMARY"
