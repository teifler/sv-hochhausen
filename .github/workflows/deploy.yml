# Veröffentlicht dist/ per SFTP auf dem Webspace.
# Läuft nach erfolgreicher CI auf main, jede Nacht (kommende Termine, Instagram) und manuell.
#
# Alle Verbindungsdaten kommen ausschließlich aus Secrets der Environment „production“
# (einrichten: scripts/deploy-secrets.sh). Nichts davon ausgeben – Repository und Logs sind öffentlich.
# Eingeschaltet wird der Deploy über die Repository-Variable DEPLOY_ENABLED = true.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC = 04:17/05:17 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Upload
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (mit Stockfotos und Instagram)
        run: npm run build
        env:
          INSTAGRAM_FEED_URL: ${{ secrets.INSTAGRAM_FEED_URL }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
      - name: Upload per SFTP
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v fehlt (Environment production)"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # Spiegeln mit --delete: entfernt auf dem Webspace, was nicht mehr in dist/ ist
          # (.well-known/ für SSL-Zertifikate und cgi-bin/ bleiben unangetastet). Ausgabe verworfen.
          lftp -c "
            set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 30;
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            open -u '$DEPLOY_USER,' -p '${DEPLOY_PORT:-22}' 'sftp://$DEPLOY_HOST';
            mirror --reverse --delete --no-perms --parallel=4 --exclude-glob .well-known/ --exclude-glob cgi-bin/ dist/ '$DEPLOY_PATH/';
          " > /dev/null
          echo "✅ Website hochgeladen ($(find dist -name '*.html' | wc -l) Seiten)." >> "$GITHUB_STEP_SUMMARY"
      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key
